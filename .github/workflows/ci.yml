name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run syntax and manifest checks
        run: bash tests/run-smoke.sh

      - name: Run browser integration checks
        run: bash tests/run-browser-smoke.sh
